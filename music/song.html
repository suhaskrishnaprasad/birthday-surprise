<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff4f6">

  <title>A Song For You ♡</title>

  <link rel="stylesheet" href="song.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

  <div class="floating-hearts" aria-hidden="true">
    <span>♡</span>
    <span>♡</span>
    <span>♡</span>
    <span>♡</span>
    <span>♡</span>
  </div>

  <audio id="bgMusic" loop preload="auto">
    <source src="my-song.mp3" type="audio/mpeg">
  </audio>

  <main class="page-container">

    <a href="../index.html"
       class="back-link"
       onclick="sessionStorage.setItem('returnToGifts_v1', '1')">
      ← Back to surprises
    </a>

    <header class="page-heading">
      
      <h1>Exclusive spotify for you</h1>
    </header>

    <section class="music-card">

      <div class="card-decoration decoration-one">♡</div>
      <div class="card-decoration decoration-two">✧</div>

      <div class="album-art">
        <div class="vinyl">
          <div class="vinyl-center">
            <span>♡</span>
          </div>
        </div>

        <div class="album-flower">✿</div>
      </div>

      <div class="song-details">
        <p class="handwritten">
        yesss, you are my putta loka🌎❤️</p>
      </div>

      <button
        id="playButton"
        class="play-button"
        type="button"
        aria-label="Play song">
        ▶
      </button>

      <div class="progress-section">

        <input
          type="range"
          id="progress"
          min="0"
          max="100"
          value="0"
          aria-label="Song progress">

        <div class="time-display">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>

      </div>

    </section>

  </main>

  <script>
    const audio = document.getElementById("bgMusic");
    const vinyl = document.querySelector(".vinyl");
    const playButton = document.getElementById("playButton");

    const progress = document.getElementById("progress");
    const currentTime = document.getElementById("currentTime");
    const duration = document.getElementById("duration");

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "0:00";

      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = Math.floor(seconds % 60);

      return `${minutes}:${String(remainingSeconds).padStart(2, "0")}`;
    }

    // Play / Pause button
    playButton.addEventListener("click", async () => {

      if (audio.paused) {
        try {
          await audio.play();
        } catch (error) {
          console.error("Unable to play audio:", error);
        }
      } else {
        audio.pause();
      }

    });

    // When music starts
    audio.addEventListener("play", () => {
      playButton.textContent = "Ⅱ";
      playButton.setAttribute("aria-label", "Pause song");

      vinyl.classList.add("playing");
    });

    // When music pauses
    audio.addEventListener("pause", () => {
      playButton.textContent = "▶";
      playButton.setAttribute("aria-label", "Play song");

      vinyl.classList.remove("playing");
    });

    // Song duration
    audio.addEventListener("loadedmetadata", () => {
      duration.textContent = formatTime(audio.duration);
    });

    // Update progress bar
    audio.addEventListener("timeupdate", () => {
      currentTime.textContent = formatTime(audio.currentTime);

      if (Number.isFinite(audio.duration) && audio.duration > 0) {
        progress.value = (audio.currentTime / audio.duration) * 100;
      }
    });

    // Seek through song
    progress.addEventListener("input", () => {
      if (Number.isFinite(audio.duration) && audio.duration > 0) {
        audio.currentTime = (progress.value / 100) * audio.duration;
      }
    });

    // Audio error
    audio.addEventListener("error", () => {
      console.error("Audio error:", audio.error);
    });

    // IMPORTANT:
    // No autoplay. Music starts ONLY when the Play button is clicked.
  </script>

</body>
</html>
